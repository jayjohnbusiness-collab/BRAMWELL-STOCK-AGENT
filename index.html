<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Bramwell — you'll hear from him when it matters. A market-monitoring agent with the manner of a butler."
    />
    <meta name="color-scheme" content="light dark" />
    <!-- Browser chrome tint, matched to each theme's ground. -->
    <meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f141b" media="(prefers-color-scheme: dark)" />
    <title>Bramwell — Your market, kept in order.</title>

    <!-- Icons. SVG favicon (relative to the app path); PNG for iOS home screen. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="canonical" href="https://jayjohnbusiness-collab.github.io/BRAMWELL-STOCK-AGENT/" />

    <!-- Open Graph — how the link renders when shared (LinkedIn, Slack, iMessage…). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bramwell" />
    <meta property="og:title" content="Bramwell — Your market, kept in order." />
    <meta
      property="og:description"
      content="A market-monitoring agent with the manner of a butler. You'll hear from him when it matters."
    />
    <meta property="og:url" content="https://jayjohnbusiness-collab.github.io/BRAMWELL-STOCK-AGENT/" />
    <meta property="og:image" content="https://jayjohnbusiness-collab.github.io/BRAMWELL-STOCK-AGENT/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bramwell — your market, kept in order." />

    <!-- Twitter / X large-image card. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bramwell — Your market, kept in order." />
    <meta
      name="twitter:description"
      content="A market-monitoring agent with the manner of a butler. You'll hear from him when it matters."
    />
    <meta name="twitter:image" content="https://jayjohnbusiness-collab.github.io/BRAMWELL-STOCK-AGENT/og.png" />
    <script>
      // Apply the saved (or OS) theme before first paint — no flash of light.
      (function () {
        try {
          var t = localStorage.getItem("bramwell.theme");
          if (t !== "dark" && t !== "light" && t !== "glass") {
            t =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
