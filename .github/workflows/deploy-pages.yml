name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/new-session-lmgv9o"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build self-contained single-file bundle
        run: npm run build
        env:
          SINGLE_FILE: "1"
      - uses: actions/configure-pages@v5
        with:
          # Enable Pages automatically on first run (works for public repos, or
          # private repos on a plan that includes Pages).
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
